<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-label="Animated terminal: Teresa, full-stack developer, cybersecurity and CyberKnife">
<style>
  text { font-family:Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .prompt {fill:#4ade80;font-size:19px}
  .output {fill:#b4f8cb;font-size:18px}
  .accent {fill:#61f59b}
  .line {opacity:0;animation:enter 14s linear infinite}
  .one{animation-delay:0s}.two{animation-delay:0s}.three{animation-delay:0s}.four{animation-delay:0s}.five{animation-delay:0s}.six{animation-delay:0s}
  @keyframes enter{0%,3%{opacity:0} 8%,91%{opacity:1} 96%,100%{opacity:0}}
  .one{animation-name:l1}.two{animation-name:l2}.three{animation-name:l3}.four{animation-name:l4}.five{animation-name:l5}.six{animation-name:l6}
  @keyframes l1{0%,4%{opacity:0}5%,94%{opacity:1}98%,100%{opacity:0}}
  @keyframes l2{0%,15%{opacity:0}16%,94%{opacity:1}98%,100%{opacity:0}}
  @keyframes l3{0%,26%{opacity:0}27%,94%{opacity:1}98%,100%{opacity:0}}
  @keyframes l4{0%,37%{opacity:0}38%,94%{opacity:1}98%,100%{opacity:0}}
  @keyframes l5{0%,48%{opacity:0}49%,94%{opacity:1}98%,100%{opacity:0}}
  @keyframes l6{0%,61%{opacity:0}62%,94%{opacity:1}98%,100%{opacity:0}}
  .cursor{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.line{opacity:1;animation:none}.cursor{animation:none}}
</style>
<rect x="1" y="1" width="858" height="308" rx="13" fill="#06100a" stroke="#296b3d" stroke-width="2"/>
<path d="M14 1H846Q859 1 859 14V42H1V14Q1 1 14 1Z" fill="#16261d"/>
<circle cx="26" cy="22" r="7" fill="#fb5f57"/>
<circle cx="49" cy="22" r="7" fill="#fabb2c"/>
<circle cx="72" cy="22" r="7" fill="#2cce69"/>
<text x="430" y="28" text-anchor="middle" font-size="15" fill="#a5e9bd">kali@kali — terminal</text>
<g class="prompt">
  <text class="line one" x="29" y="88">$ whoami</text>
  <text class="line three" x="29" y="161">$ cat focus.txt</text>
  <text class="line five" x="29" y="236">$ Profile --status</text>
</g>
<g class="output">
  <text class="line two" x="29" y="121">Tere | Full-Stack Developer </text>
  <text class="line four" x="29" y="195">Python · PHP/Laravel · APIs · Application Security</text>
  <text class="line six accent" x="29" y="270">[+] Searching, find it, testing,  &amp; building ... <tspan class="cursor">▌</tspan></text>
</g>
</svg>
